<body>

<h1>A Virtual Garden</h1>

    <h2>Aurora, Ontario</h2>

    <p>This is a little garden that responds to the weather outside in Aurora!</p>

       <img id="garden-image" src="images/garden-clear.png">
        <p id="temperature">Loading temperature...</p>

        <button onclick="getWeather()">Refresh Weather</button>
    </div>

    <p>
        Weather data from
        <a href="https://open-meteo.com/">Open-Meteo</a>.
    </p>
